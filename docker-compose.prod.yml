version: "3.9"

# Uso: docker compose -f docker-compose.prod.yml up --build -d
# Diferencias vs dev: build multi-stage sin hot reload, sin montar código fuente
# como volumen, frontend servido por Nginx, backend en modo "production".

services:
  db:
    image: postgres:16-alpine
    container_name: verificadora_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - verificadora-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No se expone el puerto al host en producción; solo accesible dentro de la red interna.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verificadora_backend
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      NODE_ENV: production
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - verificadora-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-/api}
    container_name: verificadora_frontend
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - verificadora-net

networks:
  verificadora-net:
    driver: bridge

volumes:
  db_data:
  backend_uploads:
