version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: verificadora_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-verificadora_db}
      POSTGRES_USER: ${DB_USER:-verificadora_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_dev_only}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - verificadora-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-verificadora_user} -d ${DB_NAME:-verificadora_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: verificadora_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      NODE_ENV: development
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - verificadora-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: verificadora_frontend
    restart: unless-stopped
    environment:
      API_URL: http://localhost:${BACKEND_PORT:-3000}/api
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - verificadora-net

networks:
  verificadora-net:
    driver: bridge

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules: